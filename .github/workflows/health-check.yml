name: Health Check

on:
  schedule:
    # Run once a day to catch data drift and link rot without flooding the queue.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the pricing-data health check
        run: npm run health-check
